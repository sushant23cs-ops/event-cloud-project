<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Event Cloud</a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="dashboard.html">My Registrations</a>
      <a class="btn btn-outline-light btn-sm" href="login.html" id="loginBtn">Login</a>
      <button class="btn btn-warning btn-sm" id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </div>
</nav>

<div class="container py-4">

  <div class="row g-2 align-items-end mb-3">
    <div class="col-12 col-md-6">
      <label class="form-label">Filter by Category</label>
      <select id="categorySelect" class="form-select">
        <option value="">All</option>
      </select>
    </div>
    <div class="col-12 col-md-6">
      <button class="btn btn-dark w-100" onclick="applyFilter()">Apply Filter</button>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="m-0">All Events</h3>
    <button class="btn btn-secondary btn-sm" onclick="loadEvents()">Refresh</button>
  </div>

  <div id="status" class="text-muted mb-3"></div>
  <div id="events" class="row g-3"></div>
</div>

<script src="config.js"></script>
<script>
const statusEl = document.getElementById("status");
const eventsEl = document.getElementById("events");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const categorySelect = document.getElementById("categorySelect");

function setAuthUI() {
  const logged = isLoggedIn();
  loginBtn.style.display = logged ? "none" : "inline-block";
  logoutBtn.style.display = logged ? "inline-block" : "none";
  logoutBtn.onclick = logout;
}

function formatDate(d) {
  return String(d || "").slice(0, 10);
}

function card(event) {
  const canRegister = isLoggedIn();
  return `
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">${event.title || "Untitled"}</h5>

          <div class="text-muted small mb-2">
            <div><b>Category:</b> ${event.category ?? "General"}</div>
            <div><b>Date:</b> ${formatDate(event.event_date)}</div>
            <div><b>Location:</b> ${event.location ?? "-"}</div>
            ${event.capacity != null ? `<div><b>Capacity:</b> ${event.capacity}</div>` : ""}
          </div>

          <p class="card-text">${event.description ?? ""}</p>

          <button class="btn btn-primary w-100" ${canRegister ? "" : "disabled"}
            onclick="registerEvent(${event.id})">
            ${canRegister ? "Register for this event" : "Login to Register"}
          </button>
        </div>
      </div>
    </div>
  `;
}

async function loadCategories() {
  const { ok, data } = await apiFetch("/api/categories");
  if (!ok) return;

  categorySelect.innerHTML =
    `<option value="">All</option>` +
    data.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
}

async function loadEvents(category = "") {
  statusEl.textContent = "Loading events...";
  eventsEl.innerHTML = "";

  const q = category ? `?category=${encodeURIComponent(category)}` : "";
  const { ok, data } = await apiFetch(`/api/events${q}`);

  if (!ok) {
    statusEl.textContent = "Failed to load events.";
    alert(data.error || data.message || "Failed to load events");
    return;
  }

  statusEl.textContent = `Loaded ${data.length} event(s).`;
  eventsEl.innerHTML = data.map(card).join("");
}

async function applyFilter() {
  const cat = categorySelect.value;
  await loadEvents(cat);
}

async function registerEvent(event_id) {
  if (!isLoggedIn()) {
    alert("Please login first.");
    window.location.href = "login.html";
    return;
  }

  const { ok, data } = await apiFetch("/api/register-event", {
    method: "POST",
    body: { event_id },
    auth: true,
  });

  if (!ok) {
    alert(data.error || data.message || "Registration failed");
    return;
  }

  alert("Registered for event!");
  // Optional: go to dashboard automatically
  // window.location.href = "dashboard.html";
}

setAuthUI();
loadCategories();
loadEvents();
</script>
</body>
</html>
