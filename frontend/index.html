<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Event Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <span class="navbar-brand">Event Manager</span>
    <div>
      <a href="login.html" class="btn btn-outline-light btn-sm">Login</a>
      <a href="dashboard.html" class="btn btn-warning btn-sm">Admin</a>
      <a href="my.html" class="btn btn-primary btn-sm">My Registrations</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h3 class="text-white mb-3">Upcoming Events</h3>

  <div class="card p-3 mb-3">
    <div class="row g-2">
      <div class="col-md-8">
        <input id="searchBox" class="form-control" placeholder="Search by title or location..." oninput="applyFilters()">
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select" onchange="applyFilters()">
          <option value="ALL" selected>All Categories</option>
          <option value="Concert">Concert</option>
          <option value="Seminar">Seminar</option>
          <option value="Workshop">Workshop</option>
          <option value="Sports">Sports</option>
          <option value="Festival">Festival</option>
          <option value="General">General</option>
        </select>
      </div>
    </div>
  </div>

  <div id="events" class="row g-3"></div>
</div>

<script src="config.js"></script>
<script>
let allEvents = [];

function token() {
  return localStorage.getItem("token");
}

async function loadEvents() {
  const res = await fetch(`${API_BASE}/api/events`);
  allEvents = await res.json();
  applyFilters();
}

function applyFilters() {
  const q = (document.getElementById("searchBox").value || "").toLowerCase().trim();
  const cat = document.getElementById("categoryFilter").value || "ALL";

  let filtered = allEvents;

  if (cat !== "ALL") {
    filtered = filtered.filter(e => (e.category || "General") === cat);
  }

  if (q) {
    filtered = filtered.filter(e =>
      (e.title || "").toLowerCase().includes(q) ||
      (e.location || "").toLowerCase().includes(q)
    );
  }

  renderEvents(filtered);
}

function renderEvents(events) {
  const wrap = document.getElementById("events");
  wrap.innerHTML = "";

  if (!events.length) {
    wrap.innerHTML = `<div class="col-12"><div class="alert alert-info">No events found.</div></div>`;
    return;
  }

  events.forEach(e => {
    const card = document.createElement("div");
    card.className = "col-md-4";
    card.innerHTML = `
      <div class="card shadow h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <h5 class="card-title">${e.title}</h5>
            <span class="badge bg-dark">${e.category || "General"}</span>
          </div>
          <p class="card-text mb-1"><b>Date:</b> ${e.event_date}</p>
          <p class="card-text mb-1"><b>Location:</b> ${e.location}</p>
          <p class="card-text"><b>Capacity:</b> ${e.capacity}</p>
          <button class="btn btn-success w-100" onclick="registerEvent(${e.id})">Register</button>
        </div>
      </div>
    `;
    wrap.appendChild(card);
  });
}

async function registerEvent(eventId) {
  if (!token()) return alert("Login first!");

  const res = await fetch(`${API_BASE}/api/registrations/${eventId}`, {
    method: "POST",
    headers: { "Authorization": "Bearer " + token() }
  });

  const data = await res.json();
  if (!res.ok) return alert(data.message || "Failed");
  alert("Registered!");
}

loadEvents();
</script>

</body>
</html>
