<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width:500px;">
  <div class="card shadow">
    <div class="card-body">
      <h3>Login</h3>

      <input id="email" class="form-control mb-2" placeholder="Email">
      <input id="password" type="password" class="form-control mb-3" placeholder="Password">
      <button class="btn btn-dark w-100 mb-3" onclick="login()">Login</button>

      <hr>

      <h5>Register</h5>
      <input id="nameR" class="form-control mb-2" placeholder="Name">
      <input id="emailR" class="form-control mb-2" placeholder="Email">
      <input id="passR" type="password" class="form-control mb-3" placeholder="Password">
      <button class="btn btn-success w-100" onclick="register()">Register</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(`${API_BASE}/api/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  if (!res.ok) {
    alert(data.message);
    return;
  }

  localStorage.setItem("token", data.token);
  localStorage.setItem("role", data.user.role);
  alert("Login Successful!");
  window.location.href = "index.html";
}

async function register() {
  const name = document.getElementById("nameR").value;
  const email = document.getElementById("emailR").value;
  const password = document.getElementById("passR").value;

  const res = await fetch(`${API_BASE}/api/auth/register`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, password })
  });

  const data = await res.json();
  if (!res.ok) {
    alert(data.message);
    return;
  }

  alert("Registered! Now login.");
}
</script>

</body>
</html>
