<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My Registrations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Event Cloud</a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="index.html">All Events</a>
      <button class="btn btn-warning btn-sm" id="logoutBtn">Logout</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h3>My Registrations</h3>
  <div id="status" class="text-muted mb-3"></div>
  <ul id="list" class="list-group"></ul>
</div>

<script src="config.js"></script>
<script>
document.getElementById("logoutBtn").onclick = logout;

const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");

function formatDate(d) {
  return String(d || "").slice(0, 10);
}

async function loadMyRegs() {
  if (!isLoggedIn()) {
    alert("Please login first.");
    window.location.href = "login.html";
    return;
  }

  statusEl.textContent = "Loading your registrations...";
  listEl.innerHTML = "";

  const { ok, data } = await apiFetch("/api/my-registrations", { auth: true });

  if (!ok) {
    alert(data.error || data.message || "Failed to load registrations");
    statusEl.textContent = "Failed to load registrations.";
    return;
  }

  statusEl.textContent = `You have ${data.length} registration(s).`;

  if (data.length === 0) {
    listEl.innerHTML = `<li class="list-group-item">No registrations yet.</li>`;
    return;
  }

  listEl.innerHTML = data.map(e => `
    <li class="list-group-item">
      <div class="fw-bold">${e.title || "Untitled"}</div>
      <div class="small text-muted">
        ${e.category ? `Category: ${e.category} • ` : ""}
        Date: ${formatDate(e.event_date)} •
        Location: ${e.location || "-"}
      </div>
      ${e.description ? `<div class="mt-1">${e.description}</div>` : ""}
    </li>
  `).join("");
}

loadMyRegs();
</script>
</body>
</html>
