<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Registrations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-4">
  <h3>My Registered Events</h3>
  <div id="myEvents"></div>
</div>

<script src="config.js"></script>
<script>
function getToken() {
  return localStorage.getItem("token");
}

async function loadMyEvents() {
  const token = getToken();
  if (!token) {
    alert("Login first");
    window.location.href = "login.html";
    return;
  }

  const res = await fetch(`${API_BASE}/api/me/registrations`, {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const events = await res.json();

  const container = document.getElementById("myEvents");
  container.innerHTML = "";

  events.forEach(e => {
    container.innerHTML += `
      <div class="card mb-2 p-2">
        <b>${e.title}</b> | ${e.event_date} | ${e.location}
        <button class="btn btn-warning btn-sm float-end"
          onclick="cancel(${e.id})">Cancel</button>
      </div>
    `;
  });
}

async function cancel(eventId) {
  await fetch(`${API_BASE}/api/me/cancel/${eventId}`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + getToken()
    }
  });

  alert("Cancelled");
  loadMyEvents();
}

loadMyEvents();
</script>

</body>
</html>
